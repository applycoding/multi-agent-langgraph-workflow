[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-langgraph-workflow"
version = "0.1.0"
description = "Portfolio demo: a LangGraph planner, researcher, and writer with human approval."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arpan Bom" }]
dependencies = [
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
workflow = "workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Pydantic Field() and FastAPI Path() are intentional calls in signatures.
ignore = ["B008"]
